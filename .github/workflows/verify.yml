name: Verify catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python3 scripts/verify.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check immutable history and released contracts
        env:
          IMMUTABLE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          cli_path=$(python3 scripts/install-cli.py)
          if [ -n "$IMMUTABLE_BASE" ] && [ "$IMMUTABLE_BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/verify.py --cli "$cli_path" --base-ref "$IMMUTABLE_BASE"
          else
            python3 scripts/verify.py --cli "$cli_path"
          fi
